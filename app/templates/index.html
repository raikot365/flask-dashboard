{% extends 'layout.html' %}
{% block title %}Dashboard{% endblock %}
{% block body %}
<style>
  .controls-wrapper { max-width: 1200px; margin: 0 auto; }

  .charts-fluid { width: 100%; background: transparent; padding: 0 12px; }
  .charts-inner {
    max-width: 1600px;
    margin: 0 auto;
  }

  #chartsContainer {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 1rem;
  }
  @media (max-width: 1600px) { #chartsContainer { grid-template-columns: repeat(5, 1fr); } }
  @media (max-width: 1400px) { #chartsContainer { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 1100px) { #chartsContainer { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 768px)  { #chartsContainer { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 576px)  { #chartsContainer { grid-template-columns: 1fr; } }

  .chart-card { height: 300px; display:flex; flex-direction:column; max-height: 360px; }
  .chart-card .card-body { flex:1; position:relative; padding:0.5rem; }
  .chart-card canvas { width:100% !important; height:100% !important; display:block; }

  .chart-card .card-header { font-size: 0.95rem; padding: .35rem .75rem; }

  /* inputs para grupo personalizado */
  #customGroupInputs { display: none; gap: 0.5rem; align-items: center; }
  #customGroupInputs input { width: 100px; }
</style>

<div class="controls-wrapper my-4">
  <div class="row mb-3">
      <div class="col-md-5">
          <input type="date" id="datePicker" class="form-control" value="{{ initial_date }}">
      </div>
      <div class="col-md-5">
          <select id="turnoSelect" class="form-select">
              <option value="TM" {% if initial_turno == 'TM' %}selected{% endif %}>Mañana (7:15-15:15hs)</option>
              <option value="TT" {% if initial_turno == 'TT' %}selected{% endif %}>Tarde (15:15-23:15hs)</option>
              <option value="TN" {% if initial_turno == 'TN' %}selected{% endif %}>Noche (23:15-7:15hs)</option>
          </select>
      </div>
      <div class="col-md-2">
          <button id="filterBtn" class="btn btn-primary w-100">Filtrar por turno</button>
      </div>
  </div>

  <div class="row mb-3">
      <div class="col-md-5">
          <label for="startDate" style="margin-right: 5px;">Fecha y hora inicio</label>
          <input type="datetime-local" id="startDate" class="form-control" value="{{ initial_start | default('') }}">
      </div>
      <div class="col-md-5">
          <label for="endDate" style="margin-right: 5px;">Fecha y hora fin</label>
          <input type="datetime-local" id="endDate" class="form-control" value="{{ initial_end | default('') }}">
      </div>
      <div class="col-md-2 d-flex align-items-end">
          <button id="customRangeBtn" class="btn btn-outline-primary w-100">Consultar rango libre</button>
      </div>
  </div>

  <!-- Selector de grupos -->
  <div class="row mb-3">
    <div class="col-md-5">
      <label for="grupoSelect" style="margin-right: 5px;">Grupo de máquinas</label>
            <select id="grupoSelect" class="form-select">
                <option value="all">Todas</option>
                <!-- Valores con formato list:val1,val2,... para seleccionar máquinas individuales -->
                <option value="list:702,703,704,705,706">Grupo 1 (Máquinas 1–5)</option>
                <option value="list:710,711,712,713,714,715">Grupo 2 (Máquinas 6–10)</option>
                <option value="list:719,720,721,722,723">Grupo 3 (Máquinas 11–15)</option>
                             <!-- <option value="custom">Personalizado (ingresar rango)</option> -->
            </select>
    </div>
        <div class="col-md-2 d-flex align-items-end">
          <button id="resetGroupBtn" class="btn btn-secondary w-100">Reset grupos</button>
      </div>
            <!-- <div class="col-md-4" id="customGroupInputs">
                <label style="width:100%">Rango personalizado</label>
                <div style="display:flex; gap:8px;">
                    <input type="number" id="groupStart" class="form-control" placeholder="Máq. inicio" min="0">
                    <input type="number" id="groupEnd" class="form-control" placeholder="Máq. fin" min="0">
                    <button id="applyCustomGroup" class="btn btn-primary">Aplicar</button>
                </div>
            </div> -->
  </div>
</div>

<div class="charts-fluid">
  <div class="charts-inner">
    <div id="chartsContainer"></div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/chart.js') }}"></script>
<script>
    // Guardas globales para reutilizar la data sin pedir al backend cada vez
    window._lastData = null;
    window._lastParams = null;

    // Función para pedir datos al backend
    async function loadData(params) {
        const query = new URLSearchParams(params).toString();
        const res = await fetch(`/api/vista?${query}`);
        if (!res.ok) {
            const errorText = await res.text();
            console.error("Error al cargar datos:", res.status, res.statusText, errorText);
            alert("No se pudieron obtener los datos. Por favor, verifica el rango de fechas/turnos.");
            return { data: [] };
        }
        return res.json();
    }

    // Renderiza los charts a partir del objeto devuelto por el backend
    function renderCharts(data, date = null, turno = null, startISO = null, endISO = null) {
        const container = document.getElementById('chartsContainer');
        container.innerHTML = '';

        // guardar en global para poder re-filtrar sin recargar
        window._lastData = data;
        window._lastParams = { date, turno, startISO, endISO };

        if (!data || !data.data || data.data.length === 0) {
            container.innerHTML = '<div class="alert alert-warning">No hay datos para el período seleccionado.</div>';
            return;
        }

        // Obtener la selección de grupo
        const grupoVal = document.getElementById('grupoSelect').value;

        let filtered = data.data.slice(); // copia
        // parseo de m como número para comparación
        filtered = filtered.filter(item => {
            // si item.m es nulo/indef, lo excluimos
            if (item.m === undefined || item.m === null) return false;
            const mNum = Number(item.m);
            return !Number.isNaN(mNum);
        });

        // aplicar filtro según grupoVal
        if (grupoVal && grupoVal !== 'all') {
            if (grupoVal.startsWith('range:')) {
                // backward-compatible: range:min:max
                const parts = grupoVal.split(':');
                const min = Number(parts[1]);
                const max = Number(parts[2]);
                filtered = filtered.filter(item => {
                    const mNum = Number(item.m);
                    return mNum >= min && mNum <= max;
                });
            } else if (grupoVal.startsWith('list:')) {
                // new format: list:val1,val2,...
                const listPart = grupoVal.substring(5); // after 'list:'
                const allowed = listPart.split(',').map(s => Number(s.trim())).filter(n => !Number.isNaN(n));
                if (allowed.length > 0) {
                    const allowedSet = new Set(allowed);
                    filtered = filtered.filter(item => allowedSet.has(Number(item.m)));
                } else {
                    // if parsing failed, keep nothing to be safe
                    filtered = [];
                }
            }
        }

        // ordenar por número de máquina ascendente para consistencia
        filtered.sort((a,b) => Number(a.m) - Number(b.m));

        if (filtered.length === 0) {
            container.innerHTML = '<div class="alert alert-warning">No hay máquinas en el grupo seleccionado.</div>';
            return;
        }

        // Renderizar cada tarjeta + gráfico
        filtered.forEach(item => {
            const col = document.createElement('div');
            col.className = 'chart-col';

            const card = document.createElement('div');
            card.className = 'card h-100 chart-card';

            const header = document.createElement('div');
            header.className = 'card-header';
            header.style.cursor = 'pointer';
            const link = document.createElement('a');
            link.style.textDecoration = "none";
            link.style.display = "block";
            link.style.width = "100%";
            link.style.height = "100%";

            // construir href según parámetros disponibles
            if (startISO && endISO) {
                link.href = `/maquina/${item.m}?start=${encodeURIComponent(startISO)}&end=${encodeURIComponent(endISO)}`;
            } else {
                link.href = `/maquina/${item.m}?date=${encodeURIComponent(date)}&turno=${encodeURIComponent(turno)}`;
            }
            link.textContent = `Máquina ${item.m}`;
            header.appendChild(link);

            const body = document.createElement('div');
            body.className = 'card-body';
            const canvas = document.createElement('canvas');
            canvas.id = `chart-${item.m}`;
            body.appendChild(canvas);

            card.appendChild(header);
            card.appendChild(body);
            col.appendChild(card);
            container.appendChild(col);

            // valores (usa las mismas claves que tenías)
            const total = item.N || 0;
            const on = item.On || 0;
            const off = item.Off || 0;
            const prod = item.Prod || 0;
            const noProd = item.NoProd || 0;

            const percOn = total > 0 ? (on / total * 100) : 0;
            const percOff = total > 0 ? (off / total * 100) : 0;
            const percProd = on > 0 ? (prod / on * 100) : 0;
            const percNoProd = on > 0 ? (noProd / on * 100) : 0;

            const offAngle = (percOff / 100) * 360;
            const outerCirc = (percOn / 100) * 360;

            const datasetValues = [
                percNoProd, percProd,
                percOff, percOn
            ];

            const minutesByLabel = [
                noProd * 3,
                prod * 3,
                off * 3,
                on * 3
            ];

            // Crear gráfico (no guardamos instancia; se destruye al remover el canvas del DOM)
            new Chart(canvas.getContext('2d'), {
                type: 'pie',
                data: {
                    datasets: [
                        {
                            data: [percNoProd, percProd],
                            backgroundColor: ['#f0913e', '#32a5e7'],
                            circumference: outerCirc,
                            rotation: offAngle,
                            hoverBorderColor: '#808080'
                        },
                        {
                            data: [percOff, percOn],
                            backgroundColor: ['#eb4034', '#31bd4b'],
                            circumference: 360,
                            hoverBorderColor: '#808080'
                        }
                    ],
                    labels: ['Sin Producir', 'Produciendo', 'Apagada', 'Encendida']
                },
                options: {
                    maintainAspectRatio: false,
                    plugins: {
                        tooltip: {
                            callbacks: {
                                title: function() { return ''; },
                                label: function(context) {
                                    const labelIndex = (context.datasetIndex * 2) + context.dataIndex;
                                    const mins = minutesByLabel[labelIndex] ?? 0;
                                    return `${context.chart.data.labels[labelIndex]}: ${mins} min`;
                                }
                            }
                        },
                        legend: {
                            labels: {
                                font: { size: 12 },
                                boxWidth: 10,
                                generateLabels: function(chart) {
                                    const original = Chart.overrides.pie.plugins.legend.labels.generateLabels;
                                    const labelsOriginal = original.call(this, chart);
                                    let datasetColors = chart.data.datasets.map(e => e.backgroundColor).flat();
                                    const flatValues = chart.data.datasets.map(d => d.data).flat();

                                    labelsOriginal.forEach(label => {
                                        const labelIndex = label.index;
                                        label.datasetIndex = Math.floor(labelIndex / 2);
                                        label.hidden = !chart.isDatasetVisible(label.datasetIndex);
                                        label.fillStyle = datasetColors[labelIndex];
                                        const val = (flatValues[labelIndex] ?? 0);
                                        label.text = `${chart.data.labels[labelIndex]}: ${Number(val).toFixed(1)}%`;
                                    });

                                    return labelsOriginal;
                                }
                            },
                            onClick: function(e, legendItem, legend) {
                                const chart = legend.chart;
                                const index = legendItem.datasetIndex;
                                // toggle visibility
                                chart.getDatasetMeta(index).hidden = chart.isDatasetVisible(index);
                                chart.update();
                            }
                        }
                    }
                }
            });
        });
    }

    // -> Utils: pedir datos y guardar último resultado
    async function fetchAndRender(params) {
        const data = await loadData(params);
        // guardar la última data y parámetros
        window._lastData = data;
        window._lastParams = params;
        // params puede tener start/end o date/turno; desglosamos para renderCharts
        const date = params.date || null;
        const turno = params.turno || null;
        const start = params.start || null;
        const end = params.end || null;
        renderCharts(data, date, turno, start, end);
    }

    // Eventos
    document.addEventListener('DOMContentLoaded', async () => {
        // Valores iniciales desde Jinja
        const initial_date_param = '{{ initial_date }}';
        const initial_turno_param = '{{ initial_turno }}';
    const initial_start_param = "{{ initial_start | default('') }}";
    const initial_end_param = "{{ initial_end | default('') }}";

        // setear inputs
        document.getElementById('datePicker').value = initial_date_param;
        document.getElementById('turnoSelect').value = initial_turno_param;
        document.getElementById('startDate').value = initial_start_param;
        document.getElementById('endDate').value = initial_end_param;

        // añadir listener del control de grupos: simple re-render usando la data ya cargada
        const grupoSelect = document.getElementById('grupoSelect');
        if (grupoSelect) {
            grupoSelect.addEventListener('change', () => {
                if (window._lastData) {
                    renderCharts(window._lastData, window._lastParams?.date, window._lastParams?.turno, window._lastParams?.start, window._lastParams?.end);
                }
            });
        }

        // reset button
        const resetGroupBtn = document.getElementById('resetGroupBtn');
        if (resetGroupBtn) {
            resetGroupBtn.addEventListener('click', () => {
                document.getElementById('grupoSelect').value = 'all';
                if (window._lastData) {
                    renderCharts(window._lastData, window._lastParams?.date, window._lastParams?.turno, window._lastParams?.start, window._lastParams?.end);
                }
            });
        }

        // botones de filtro
        document.getElementById('filterBtn').addEventListener('click', async () => {
            const date = document.getElementById('datePicker').value;
            const turno = document.getElementById('turnoSelect').value;
            const params = { date, turno };
            await fetchAndRender(params);
        });

        document.getElementById('customRangeBtn').addEventListener('click', async () => {
            const startISO = document.getElementById('startDate').value;
            const endISO = document.getElementById('endDate').value;

            if (!startISO || !endISO) {
                alert("Por favor completá las fechas y horas de inicio y fin.");
                return;
            }

            try {
                const params = { start: startISO, end: endISO };
                await fetchAndRender(params);
            } catch (err) {
                console.error("Error al cargar datos por rango personalizado:", err);
            }
        });

        // carga inicial automática
        let paramsToLoad = {};
        if (initial_start_param !== '' && initial_end_param !== '') {
            paramsToLoad = { start: initial_start_param, end: initial_end_param };
        } else {
            paramsToLoad = { date: initial_date_param, turno: initial_turno_param };
        }
        await fetchAndRender(paramsToLoad);

        // botón navbar (si existe)
        const navBtn = document.getElementById('navMaquinasBtn');
        if (navBtn) {
            navBtn.addEventListener('click', () => {
                const startISO = document.getElementById('startDate').value;
                const endISO   = document.getElementById('endDate').value;
                let url;
                if (startISO && endISO) {
                    url = `/maquinas?start=${encodeURIComponent(startISO)}&end=${encodeURIComponent(endISO)}`;
                } else {
                    const date  = document.getElementById('datePicker').value;
                    const turno = document.getElementById('turnoSelect').value;
                    url = `/maquinas?date=${encodeURIComponent(date)}&turno=${encodeURIComponent(turno)}`;
                }
                window.location.href = url;
            });
        }
    });
</script>
{% endblock %}
